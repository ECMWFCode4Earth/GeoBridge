[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geobridge"
dynamic = ["version"]
description = "Python bridge between Copernicus Data Stores (C3S, CAMS, CEMS) and mainstream GIS operations"
readme = "README_pypi.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kostas Fokeas and Ilias Machairas" }]
keywords = [
  "copernicus", "climate", "GIS", "WMTS", "ERA5", "CAMS", "CEMS",
  "zarr", "geotiff", "earth-observation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Minimal runtime dependencies (discover, wmts, style, semantic all work standalone)
dependencies = [
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
zarr = [
  "xarray>=2023.1",
  "zarr>=2.16",
  "rioxarray>=0.14",
  "numpy>=1.24",
  "rasterio>=1.3",
  "fsspec>=2023.1",
  "dask>=2023.1",
]
full = [
  "geobridge[zarr]",
  "owslib>=0.28",
  "pyproj>=3.5",
  "cfgrib>=0.9.10",
  "netCDF4>=1.6",
]
dev = [
  "geobridge[full]",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "responses>=0.23",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-pyyaml",
  "types-requests",
  "build",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "sphinx-autodoc-typehints>=1.25",
]

[project.urls]
Homepage = "https://github.com/ECMWFCode4Earth/GeoBridge"
Repository = "https://github.com/ECMWFCode4Earth/GeoBridge"
Issues = "https://github.com/ECMWFCode4Earth/GeoBridge/issues"
Documentation = "https://geobridge.readthedocs.io"

[tool.hatch.version]
path = "geobridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["geobridge"]

[tool.hatch.build.targets.wheel.force-include]
"geobridge/semantic/vocabulary.yaml" = "geobridge/semantic/vocabulary.yaml"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
